
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unique Online Service Buy & Sell</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#123b70;color:white;padding:25px 15px;text-align:center}
header h1{margin:0 0 10px;font-size:25px}
main{max-width:850px;margin:auto;padding:16px}
.card{background:white;padding:18px;border-radius:12px;margin:15px 0;box-shadow:0 3px 12px #0001}
input,select,textarea,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd3df;border-radius:7px;font-size:16px}
button{background:#1261b0;color:white;border:0;font-weight:bold;cursor:pointer}
.listing img{width:100%;max-height:280px;object-fit:contain;background:#eee}
.price{color:#087b43;font-weight:bold;font-size:22px}
small{color:#64748b}
</style>
</head>
<body>
<header>
<h1>Unique Online Service Buy & Sell</h1>
<p>Buy and Sell Used Mobiles & Cars</p>
</header>
<main>
<div class="card">
<h2>Find Your Item</h2>
<input id="search" placeholder="Search mobile phones or cars..." oninput="showItems()">
</div>
<div class="card">
<h2>Latest Listings</h2>
<div id="items">No listings available yet.</div>
</div>
<div class="card">
<h2>Post a New Listing</h2>
<p><small>Admin posting form — secure login is not yet configured.</small></p>
<input id="title" placeholder="Item name or model">
<select id="category">
<option value="Mobile Phone">Mobile Phone</option>
<option value="Car">Car</option>
</select>
<input id="price" type="number" placeholder="Price (INR ₹)">
<textarea id="desc" placeholder="Item description and condition"></textarea>
<label>Upload Item Photo</label>
<input id="photo" type="file" accept="image/*">
<input id="phone" placeholder="Contact phone number">
<button onclick="addItem()">Add Listing</button>
</div>
</main>
<footer style="text-align:center;padding:20px">
© 2026 Unique Online Service Buy & Sell
</footer>
<script>
let products=[];
function showItems(){
const q=document.getElementById('search').value.toLowerCase();
const found=products.filter(p=>(p.title+' '+p.category+' '+p.desc).toLowerCase().includes(q));
document.getElementById('items').innerHTML=found.length?found.map(p=>`
<div class="card listing">
${p.photo?`<img src="${p.photo}" alt="Item photo">`:''}
<h3>${p.title}</h3><p>${p.category}</p>
<div class="price">₹${p.price}</div>
<p>${p.desc}</p><p>Contact: ${p.phone||'Not provided'}</p>
</div>`).join(''):'No listings found.';
}
function addItem(){
const title=document.getElementById('title').value.trim();
const price=document.getElementById('price').value;
const file=document.getElementById('photo').files[0];
if(!title||!price){alert('Please enter the item name and price.');return;}
const p={title,price,category:document.getElementById('category').value,desc:document.getElementById('desc').value,phone:document.getElementById('phone').value,photo:''};
function finish(){
products.unshift(p);showItems();
['title','price','desc','phone','photo'].forEach(id=>document.getElementById(id).value='');
}
if(file){const reader=new FileReader();reader.onload=()=>{p.photo=reader.result;finish()};reader.readAsDataURL(file)}
else finish();
}
</script>
</body>
</html>
